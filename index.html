<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小公主專用記帳本">
<title>小公主專用記帳本｜無 Token OCR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{padding:22px 18px 14px;background:#fff;border-bottom:1px solid #e7e9ed;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:25px}.sub,.muted{color:#68707c;font-size:13px}.sub{margin-top:5px}
main{padding:16px 16px 90px;max-width:720px;margin:auto}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000b}
.kpi{font-size:28px;font-weight:750;margin-top:5px}
button{border:0;border-radius:13px;padding:13px 15px;font-size:16px;background:#111827;color:#fff;font-weight:650}
button.secondary{background:#eef0f3;color:#202630}.row{display:flex;gap:9px;flex-wrap:wrap}.row>*{flex:1}
input,select{width:100%;padding:12px;border:1px solid #d9dde4;border-radius:11px;font-size:16px;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;z-index:10}
nav button{flex:1;border-radius:0;background:#fff;color:#626a75;font-size:13px;padding:12px 4px}
nav button.active{color:#111827;font-weight:750}.tab{display:none}.tab.active{display:block}
.preview{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:#f0f1f3;margin-top:10px}
.item{display:flex;justify-content:space-between;align-items:flex-start;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border:0}
.green{color:#14804a}.red{color:#c23b3b}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:18px;max-height:88vh;overflow:auto}
label{display:block;font-size:13px;color:#626a75;margin:10px 0 5px}
</style>
</head>
<body>
<header><h1>小公主專用記帳本</h1><div class="sub">手機本機 OCR・無需 API Token</div></header>
<main>
<section id="home" class="tab active">
<div class="card">
<div class="muted">本月收入</div><div class="kpi" id="income">$0</div>
<div class="muted" style="margin-top:12px">本月支出</div><div class="kpi" id="expense">$0</div>
<div class="muted" style="margin-top:12px">本月淨利</div><div class="kpi" id="profit">$0</div>
</div>
<div class="card"><h3>新增帳務</h3>
<p class="muted">可自行新增收入或支出明細，不需要拍發票。</p>
<div class="row"><button id="addIncomeBtn">＋ 新增收入</button><button id="addExpenseBtn">－ 新增支出</button></div>
</div>
<div class="card"><h3>拍發票自動記帳</h3>
<p class="muted">照片直接在手機瀏覽器進行 OCR，不需要 ScanBills Token。</p>
<label>選擇發票照片</label><input id="photo" type="file" accept="image/*" capture="environment">
<img id="preview" class="preview" style="display:none">
<div class="row" style="margin-top:10px"><button id="ocrBtn">開始 OCR</button><button class="secondary" id="clearBtn">清除</button></div>
<div id="status" class="muted" style="margin-top:10px"></div></div>
</section>
<section id="books" class="tab"><div class="card"><h3>帳務</h3><div id="tx"></div></div></section>
<section id="reports" class="tab"><div class="card"><h3>損益摘要</h3><div id="report"></div></div><div class="card"><h3>付款方式／帳戶</h3><div id="accountReport"></div></div></section>
<section id="settings" class="tab"><div class="card"><h3>設定</h3><p class="muted">本版本已移除 ScanBills Token。OCR 在裝置端執行。</p>
<button class="secondary" id="exportBtn">匯出帳務 JSON</button><button class="secondary" id="resetBtn" style="margin-top:8px">清除所有帳務</button></div></section>

<section id="account-management" class="tab"><div class="card"><h3>🏦 帳戶管理</h3>
<div style="max-width:700px;margin:0 auto;padding:16px;border:1px solid #ddd;border-radius:16px;background:#fff;">
  <h2 style="margin-top:0;">🏦 帳戶管理</h2>
  <p style="color:#666;">管理現金、銀行、信用卡與其他帳戶。帳戶餘額會與「帳務」中的實際收入／支出同步：期初餘額＋收入－支出。</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
    <input id="accountName" placeholder="帳戶名稱，例如：玉山銀行" style="padding:10px;flex:1;min-width:180px;">
    <select id="accountType" style="padding:10px;">
      <option>現金</option><option>銀行</option><option>信用卡</option><option>行動支付</option><option>其他</option>
    </select>
    <input id="accountOpening" type="number" step="0.01" placeholder="期初餘額" style="padding:10px;width:130px;">
    <button type="button" onclick="addAccount()" style="padding:10px 14px;">＋新增帳戶</button>
  </div>
  <div id="accountList"></div>
</div></div></section>
</main>
<nav><button class="active" data-tab="home">首頁</button><button data-tab="books">帳務</button><button data-tab="reports">報表</button>
<button data-tab="account-management">🏦 帳戶</button>
<button data-tab="settings">設定</button></nav>
<div class="modal" id="entryModal"><div class="sheet"><h3 id="entryTitle">新增帳務</h3>
<label>類型</label><select id="e_type"><option value="income">收入</option><option value="expense">支出</option></select>
<label>日期</label><input id="e_date" type="date">
<label>明細／項目</label><input id="e_desc" placeholder="例如：客戶付款、購買文具">
<label>付款方式</label><select id="e_payment"><option>現金</option><option>銀行轉帳</option><option>信用卡</option><option>簽帳金融卡</option><option>行動支付</option><option>悠遊卡／一卡通</option><option>其他</option></select>
<label>帳戶</label><select id="e_account"></select>
<label>金額</label><input id="e_amount" type="number" min="0" step="1" placeholder="0">
<label>稅額</label><input id="e_tax" type="number" min="0" step="1" value="0">
<label>發票號碼（可不填）</label><input id="e_invoice" placeholder="例如：AB-12345678">
<label>備註（可不填）</label><input id="e_note" placeholder="補充說明">
<div class="row" style="margin-top:15px"><button id="saveEntryBtn">儲存</button><button class="secondary" id="cancelEntryBtn">取消</button></div>
</div></div>
<div class="modal" id="modal"><div class="sheet"><h3>OCR 結果確認</h3><div id="form"></div><div class="row" style="margin-top:15px"><button id="saveBtn">確認入帳</button><button class="secondary" id="cancelBtn">取消</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const KEY='zhangzhi_transactions_v3';let txs=JSON.parse(localStorage.getItem(KEY)||'[]'),pending=null,worker=null;
const $=id=>document.getElementById(id);
function money(n){return new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(txs));render()}
function render(){let inc=0,exp=0;txs.forEach(t=>t.type==='income'?inc+=+t.amount:exp+=+t.amount);
$('income').textContent=money(inc);$('expense').textContent=money(exp);$('profit').textContent=money(inc-exp);
$('tx').innerHTML=txs.length?txs.slice().reverse().map(t=>`<div class="item"><div style="flex:1"><b>${esc(t.store||t.description||'帳務')}</b><div class="muted">${esc(t.date||'')} ${esc(t.store||t.description||'')} ${t.payment?`｜${esc(t.payment)}`:''} ${t.account?`｜${esc(t.account)}`:''}</div>${t.note?`<div class="muted">${esc(t.note)}</div>`:''}</div><div style="text-align:right;margin-left:10px"><div class="${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'-'}${money(t.amount)}</div><button class="secondary editTx" data-id="${t.id}" style="padding:6px 9px;font-size:12px;margin-top:5px">編輯</button><button class="secondary deleteTx" data-id="${t.id}" style="padding:6px 9px;font-size:12px;margin-top:5px">刪除</button></div></div>`).join(''):'<div class="muted">尚無交易</div>';
document.querySelectorAll('.editTx').forEach(b=>b.onclick=()=>{
  const item=txs.find(t=>String(t.id)===String(b.dataset.id));
  if(item) openEntry(item.type,item);
});
document.querySelectorAll('.deleteTx').forEach(b=>b.onclick=()=>deleteTx(b.dataset.id));
$('report').innerHTML=`<div class="item"><span>收入</span><b>${money(inc)}</b></div><div class="item"><span>支出</span><b>${money(exp)}</b></div><div class="item"><span>淨利</span><b>${money(inc-exp)}</b></div>`;const groups={};txs.forEach(t=>{const k=(t.payment||'未設定')+'｜'+(t.account||'未設定');groups[k]=(groups[k]||0)+(t.type==='income'?+t.amount:-+t.amount)});$('accountReport').innerHTML=Object.entries(groups).map(([k,v])=>`<div class="item"><span>${esc(k)}</span><b class="${v>=0?'green':'red'}">${v>=0?'+':''}${money(v)}</b></div>`).join('')||'<div class="muted">尚無資料</div>'}
function classify(store,text){const s=(store+' '+text).toLowerCase();
if(/7-11|7-eleven|711|全家|familymart|萊爾富|ok mart|全聯|家樂福|超商|餐廳|便當|麥當勞|星巴克|咖啡/.test(s))return'餐費';
if(/中華電信|台灣大哥大|遠傳|電信|寬頻/.test(s))return'通訊費';
if(/uber|高鐵|台鐵|捷運|計程車|停車|加油|租車/.test(s))return'交通費';
if(/台電|自來水|瓦斯|水電/.test(s))return'水電費';
if(/租金|房租/.test(s))return'租金';
if(/google|microsoft|adobe|canva|openai|aws|icloud|dropbox/.test(s))return'軟體／訂閱';
if(/廣告|facebook ads|meta ads|google ads/.test(s))return'廣告費';
if(/文具|影印|辦公|office|文書/.test(s))return'辦公費';return'未分類'}
function extract(text){
const lines=text.split(/\n+/).map(x=>x.trim()).filter(Boolean);
let invoice=(text.match(/\b[A-Z]{2}[-\s]?\d{8}\b/i)||[])[0]||'';
invoice=invoice.replace(/\s+/g,'-').toUpperCase();
let date='';
const d1=text.match(/20\d{2}[\/\-.]\d{1,2}[\/\-.]\d{1,2}/);
if(d1) date=d1[0];
let store='';
const storeLine=lines.find(x=>/店名\s*[:：]/.test(x));
if(storeLine) store=storeLine.replace(/^.*店名\s*[:：]\s*/,'').trim();
if(!store){
  const known=lines.find(x=>/7-?ELEVEN|全家|萊爾富|OK超商|統一超商/i.test(x));
  if(known) store=known.trim();
}
if(!store) store='未辨識店家';
let total=0;
const totalMatch=text.match(/(?:總計|應付|合計|實付|現金)[\s:：]*([0-9][0-9,]*)/i);
if(totalMatch) total=Number(totalMatch[1].replace(/,/g,''));
let tax=0;
const taxMatch=text.match(/(?:稅額|營業稅)[\s:：]*([0-9][0-9,]*)/i);
if(taxMatch) tax=Number(taxMatch[1].replace(/,/g,''));
if(!total){
  const money=[...text.matchAll(/(?:NT\$|＄|\$)\s*([0-9][0-9,]*)/g)]
    .map(m=>Number(m[1].replace(/,/g,''))).filter(n=>n>0&&n<10000000);
  if(money.length) total=Math.max(...money);
}
return {store,total,tax,invoice,date,category:classify(store,text),raw:text}
}
$('photo').onchange=e=>{const f=e.target.files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block';$('status').textContent='照片已選取，按「開始 OCR」。'}};
$('clearBtn').onclick=()=>{$('photo').value='';$('preview').style.display='none';$('status').textContent=''};
$('ocrBtn').onclick=async()=>{const f=$('photo').files[0];if(!f){$('status').textContent='請先拍照或選擇發票照片。';return}
$('status').textContent='正在手機上辨識，第一次可能需要較久……';$('ocrBtn').disabled=true;
try{if(!worker)worker=await Tesseract.createWorker('chi_tra+eng');const {data}=await worker.recognize(f);pending=extract(data.text);
$('form').innerHTML=`<label>店家</label><input id="f_store" value="${esc(pending.store)}"><label>日期</label><input id="f_date" value="${esc(pending.date)}" placeholder="YYYY/MM/DD"><label>發票號碼</label><input id="f_invoice" value="${esc(pending.invoice)}"><label>付款方式</label><select id="f_payment"><option>現金</option><option>銀行轉帳</option><option>信用卡</option><option>簽帳金融卡</option><option>行動支付</option><option>悠遊卡／一卡通</option><option>其他</option></select>
<label>帳戶</label><select id="f_account"></select>
<label>總計</label><input id="f_total" type="number" value="${pending.total||0}"><label>稅額</label><input id="f_tax" type="number" value="${pending.tax||0}"><p class="muted">OCR 不是百分之百準確，請確認後才入帳。</p><details><summary>查看原始 OCR</summary><pre style="white-space:pre-wrap;font-size:12px">${esc(pending.raw)}</pre></details>`;
$('modal').style.display='flex';
refreshAccountSelectors();
$('status').textContent='辨識完成，請確認資料。'}catch(e){$('status').textContent='OCR 失敗：'+e.message}$('ocrBtn').disabled=false};
$('cancelBtn').onclick=()=>{$('modal').style.display='none'};
$('saveBtn').onclick=()=>{
  if(!$('f_account').value){alert('請先到「帳戶」新增帳戶，並選擇這筆發票的帳戶。');return}
  txs.push({id:Date.now(),type:'expense',store:$('f_store').value,date:$('f_date').value,invoice:$('f_invoice').value,amount:+$('f_total').value||0,tax:+$('f_tax').value||0,payment:$('f_payment').value,account:$('f_account').value,createdAt:new Date().toISOString()});save();$('modal').style.display='none';alert('已入帳')};
document.querySelectorAll('nav button[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('nav button[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));const target=$(b.dataset.tab);if(target)target.classList.add('active');if(b.dataset.tab==='account-management'&&typeof renderAccounts==='function'){renderAccounts();refreshAccountSelectors();}}));
$('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(txs,null,2)],{type:'application/json'}));a.download='小公主專用記帳本_帳務.json';a.click()};
$('resetBtn').onclick=()=>{if(confirm('確定清除所有帳務？')){txs=[];save();if(typeof renderAccounts==='function')renderAccounts()}}
let editingId=null;
function todayISO(){return new Date().toISOString().slice(0,10)}
function openEntry(type, item=null){
  editingId=item?item.id:null;
  const actualType=item?item.type:type;
  $('e_type').value=actualType;
  $('entryTitle').textContent=editingId?(actualType==='income'?'編輯收入':'編輯支出'):(actualType==='income'?'新增收入':'新增支出');
  $('e_date').value=item?.date||todayISO(); $('e_payment').value=item?.payment||'現金'; $('e_account').value=item?.account||'';
  $('e_desc').value=item?.description||item?.store||'';
  $('e_payment').value=item?.payment||'現金';
  $('e_account').innerHTML = accountOptions(item?.account||'');
  $('e_amount').value=item?.amount??'';
  $('e_tax').value=item?.tax??0;
  $('e_invoice').value=item?.invoice||'';
  $('e_note').value=item?.note||'';
  $('entryModal').style.display='flex';
}
function deleteTx(id){
  const item=txs.find(t=>String(t.id)===String(id));
  if(!item)return;
  if(confirm('確定要刪除這筆帳務嗎？')){
    txs=txs.filter(t=>String(t.id)!==String(id));
    save();
  }
}
$('addIncomeBtn').onclick=()=>openEntry('income');
$('addExpenseBtn').onclick=()=>openEntry('expense');
$('cancelEntryBtn').onclick=()=>{editingId=null;$('entryModal').style.display='none'};
$('e_type').onchange=()=>{$('entryTitle').textContent=$('e_type').value==='income'?'新增收入':'新增支出'};
$('saveEntryBtn').onclick=()=>{
  const amount=Number($('e_amount').value);
  const desc=$('e_desc').value.trim();
  const account=$('e_account').value;
  if(!amount || amount<0){alert('請輸入正確金額');return}
  if(!desc){alert('請輸入明細／項目');return}
  if(!account){alert('請先選擇帳戶');return}
  const data={
    type:$('e_type').value,
    store:desc,
    description:desc,
    date:$('e_date').value||todayISO(),
    invoice:$('e_invoice').value.trim(),
    amount,
    tax:Number($('e_tax').value)||0,
    payment:$('e_payment').value,
    account:account,
    note:$('e_note').value.trim()
  };
  if(editingId!==null){
    const idx=txs.findIndex(t=>String(t.id)===String(editingId));
    if(idx>=0) txs[idx]={...txs[idx],...data};
    editingId=null;
    save();
    $('entryModal').style.display='none';
    alert('已修改帳務');
  }else{
    txs.push({...data,id:Date.now(),createdAt:new Date().toISOString()});
    save();
    $('entryModal').style.display='none';
    alert('已新增並入帳');
  }
};
;render();


// === 小公主專用記帳本：帳戶管理 ===
(function(){
  const ACCOUNT_KEY = "princess_account_list_v1";

  function loadAccounts(){
    try { return JSON.parse(localStorage.getItem(ACCOUNT_KEY) || "[]"); }
    catch(e){ return []; }
  }
  function saveAccounts(a){ localStorage.setItem(ACCOUNT_KEY, JSON.stringify(a)); }

  function loadTransactions(){
    return Array.isArray(txs) ? txs : [];
  }

  function amountOf(t){
    const v = Number(t.amount ?? t.total ?? t.金額 ?? 0);
    return isFinite(v) ? v : 0;
  }

  function accountOf(t){
    return String(t.account ?? t.accountName ?? t.帳戶 ?? t.帳戶名稱 ?? "").trim();
  }

  function typeOf(t){
    return String(t.type ?? t.kind ?? t.類型 ?? t.收支 ?? "").toLowerCase();
  }

  function balanceFor(a){
    let bal = Number(a.opening) || 0;
    for(const t of loadTransactions()){
      if(accountOf(t) !== a.name) continue;
      const amount = amountOf(t);
      if(t.type === 'income') bal += amount;
      if(t.type === 'expense') bal -= amount;
    }
    return bal;
  }

  
  function accountOptions(selected){
    const accounts = loadAccounts();
    if(!accounts.length){
      return '<option value="">請先到「帳戶」新增帳戶</option>';
    }
    return '<option value="">請選擇帳戶</option>' + accounts.map(a =>
      '<option value="'+escapeAttr(a.name)+'" '+(a.name===selected?'selected':'')+'>'+escapeHtml(a.name)+'（'+escapeHtml(a.type)+'）</option>'
    ).join('');
  }
  function escapeHtml(v){
    return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function escapeAttr(v){
    return String(v??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  window.refreshAccountSelectors = function(selectedE, selectedF){
    const e = document.getElementById('e_account');
    const f = document.getElementById('f_account');
    if(e) e.innerHTML = accountOptions(selectedE || e.value);
    if(f) f.innerHTML = accountOptions(selectedF || f.value);
  }

  window.addAccount = function(){
    const name = document.getElementById("accountName").value.trim();
    const type = document.getElementById("accountType").value;
    const opening = Number(document.getElementById("accountOpening").value || 0);
    if(!name){ alert("請先輸入帳戶名稱"); return; }
    const accounts = loadAccounts();
    if(accounts.some(a => a.name === name)){ alert("已有相同名稱的帳戶"); return; }
    accounts.push({id:Date.now().toString(), name, type, opening});
    saveAccounts(accounts);
    document.getElementById("accountName").value = "";
    document.getElementById("accountOpening").value = "";
    renderAccounts();
    refreshAccountSelectors();
  };

  window.deleteAccount = function(id){
    const accounts = loadAccounts();
    const a = accounts.find(x=>x.id===id);
    if(!a) return;
    if(!confirm("確定要刪除「"+a.name+"」帳戶嗎？")) return;
    saveAccounts(accounts.filter(x=>x.id!==id));
    renderAccounts();
  };

  window.renderAccounts = function(){
    const box = document.getElementById("accountList");
    if(!box) return;
    const accounts = loadAccounts();
    if(!accounts.length){
      box.innerHTML = '<div style="padding:12px;color:#777;">目前還沒有帳戶，請先新增一個。</div>';
      return;
    }
    box.innerHTML = accounts.map(a=>{
      let income=0, expense=0;
      loadTransactions().forEach(t=>{
        if(accountOf(t)!==a.name) return;
        if(t.type==='income') income += amountOf(t);
        if(t.type==='expense') expense += amountOf(t);
      });
      const bal = balanceFor(a);
      const sign = bal < 0 ? "-" : "";
      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #eee;flex-wrap:wrap;">
        <div><strong>${escapeHtml(a.name)}</strong><div style="font-size:13px;color:#777;">${escapeHtml(a.type)}｜期初 ${Number(a.opening||0).toLocaleString()}｜收入 ${income.toLocaleString()}｜支出 ${expense.toLocaleString()}</div></div>
        <div style="font-weight:700;">餘額 ${sign}$${Math.abs(bal).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2})}</div>
        <button type="button" onclick="deleteAccount('${a.id}')" style="padding:7px 10px;">刪除</button>
      </div>`;
    }).join('');
  };

  function escapeHtml(v){
    return String(v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  window.addEventListener("load", function(){renderAccounts();refreshAccountSelectors();});
  window.addEventListener("storage", function(){renderAccounts();refreshAccountSelectors();});
})();




</script></body></html>
